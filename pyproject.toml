[project]
name = "ring"
version = "0.1.0"
description = "RING: Robotic Indoor Navigation Generalist"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "See LICENSE file"}
authors = [
    {name = "Allen Institute for AI"}
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "torchmetrics>=0.11.0",
    "lightning>=2.2.0",
    "av>=10.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pillow>=9.0.0",
    "h5py>=3.6.0",
    "pandas>=1.3.0",
    "omegaconf>=2.1.0",
    "filelock>=3.0.0",
    "canonicaljson>=1.4.0",
    "setproctitle>=1.2.0",
    "tqdm>=4.60.0",
    "scikit-image>=0.18.0",
    "imageio>=2.9.0",
    "opencv-python>=4.5.0",
    "open-clip-torch>=2.0.0",
    "shapely>=1.8.0",
    "transformers>=4.20.0",
    "nltk>=3.7",
    "tiktoken>=0.3.0",
    "wandb>=0.13.0",
    "huggingface-hub>=0.10.0",
    "prior>=1.0.0",
    "allenact>=0.5.0",
    "allenact-plugins>=0.5.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
    "rich>=12.0.0",
    "stringcase>=1.2.0",
    "einops>=0.6.0",
    "moviepy==1.0.3",
    "beaker-py>=2.5.0",
    "boto3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=4.0.0",
    "black>=22.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Note: AI2Thor must be installed separately from AllenAI's custom PyPI:
# pip install --extra-index-url https://ai2thor-pypi.allenai.org ai2thor==0+7c61ad0c3b4a27f169ee02dab01bb83b6303696f
